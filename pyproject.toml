[project]
name = "votetally"
version = "0.1.0"
description = "Bibb County voter turnout tracker — local pipeline from Claude for Chrome download to Cloudflare R2"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "click>=8.1",
    "python-dotenv>=1.2.2",
    "rich>=13.7",
    "watchfiles>=0.22",
]

[project.scripts]
votetally = "votetally.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/votetally"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
